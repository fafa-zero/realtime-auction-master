name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node build and integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:state-machine
      - run: npm --workspace apps/server run test:integration
      - run: npm run test:agent-contract

  python-agent:
    name: Python Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/agent/requirements.txt
      - run: python -m pip install -r services/agent/requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check services/agent tests
      - name: Type check (mypy)
        run: python -m mypy
      - run: python -m pytest --cov=services.agent.app --cov-report=term-missing --cov-report=xml:coverage-agent.xml --cov-fail-under=85 services/agent/tests
      - run: python -m services.agent.evaluate
      - run: python -m compileall -q services tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-agent-coverage
          path: coverage-agent.xml

  websocket:
    name: Miniprogram WebSocket contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm --workspace apps/server run build
      - run: python -m pip install "pytest>=8,<9" "pytest-asyncio>=0.24,<1" "websockets>=13,<17"
      - name: Start server
        run: |
          PORT=4300 CLIENT_URL=http://127.0.0.1:4300 AUCTION_DATA_FILE=/tmp/auction-state.json \
            npm --workspace apps/server run start > /tmp/auction-server.log 2>&1 &
          echo $! > /tmp/auction-server.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4300/api/health && exit 0
            sleep 1
          done
          cat /tmp/auction-server.log
          exit 1
      - run: python -m pytest -q tests/websocket
      - if: always()
        run: kill "$(cat /tmp/auction-server.pid)" 2>/dev/null || true

  e2e:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
