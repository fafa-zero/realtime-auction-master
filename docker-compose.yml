services:
  auction:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4300:4300"
    environment:
      PORT: "4300"
      CLIENT_URL: "http://localhost:4300"
      AUCTION_STORAGE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: auction
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auctionpass}
      MYSQL_DATABASE: realtime_auction
      MYSQL_CONNECTION_LIMIT: "10"
      REDIS_URL: redis://redis:6379/0
      REDIS_SNAPSHOT_TTL_SECONDS: "15"
      REDIS_SNAPSHOT_CACHE_READS: "false"
      AGENT_BASE_URL: http://agent:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-local-agent-token}
      HOST_INVITE_CODE: ${HOST_INVITE_CODE:-compose-host}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      USTC_LLM_API_KEY: ${USTC_LLM_API_KEY:-}
      USTC_LLM_API_URL: ${USTC_LLM_API_URL:-}
      USTC_LLM_MODEL: ${USTC_LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
    depends_on:
      mysql:
        condition: service_healthy
      agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8100:8100"
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-local-agent-token}
      REDIS_URL: redis://redis:6379/0
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      USTC_LLM_API_KEY: ${USTC_LLM_API_KEY:-}
      USTC_LLM_API_URL: ${USTC_LLM_API_URL:-}
      USTC_LLM_MODEL: ${USTC_LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: realtime_auction
      MYSQL_USER: auction
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auctionpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
